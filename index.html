<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Nunito',system-ui,sans-serif;color:#1F2340;background:#FFF6E5;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none}
input,select,textarea{font-family:inherit;color:#1F2340}
.app{display:flex;height:100vh;height:100dvh;overflow:hidden}
.side{width:250px;flex:none;background:#2B1B6B;color:#fff;display:flex;flex-direction:column;padding:22px 16px;gap:8px;overflow-y:auto}
.logo{display:flex;align-items:center;gap:12px;padding:4px 8px 16px}
.logo i{width:50px;height:50px;border-radius:16px;background:linear-gradient(145deg,#34D17A,#0E9F4F);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:36px;font-style:normal;line-height:1;box-shadow:0 4px 0 #087338}
.logo div{display:flex;flex-direction:column;line-height:1.1}
.logo b{font-size:20px;font-weight:900}
.logo span{font-size:13px;font-weight:700;color:#D9CFFF}
.nav{display:flex;align-items:center;gap:12px;min-height:50px;padding:4px 12px;border-radius:16px;font-weight:800;font-size:17px;background:transparent;color:#fff;text-align:left;width:100%}
.nav.act{background:#fff;color:#1F2340}
.nav i{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;font-style:normal;color:#1F2340;flex:none}
.sidebtn{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:16px;font-weight:900;font-size:17px;width:100%}
.sidebtn.y{background:#FFC21A;color:#1F2340;margin-top:8px}
.sidebtn.o{background:transparent;border:2px solid #7B63D6;color:#fff;font-size:15px;font-weight:800;min-height:48px}
.sidenote{background:#3F2A92;border-radius:16px;padding:12px 14px;font-size:13px;font-weight:700;line-height:1.4;color:#E6DEFF;margin-top:auto}
.sidenote button{margin-top:8px;background:#fff;color:#2B1B6B;border-radius:999px;font-weight:800;font-size:13px;min-height:40px;padding:0 14px}
.main{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;padding:20px 30px 10px;gap:16px}
.top h1{margin:0;font-size:30px;font-weight:900;line-height:1.1}
.top small{font-size:14px;font-weight:700;color:#5B5F85}
.badge{background:#FFC21A;color:#1F2340;font-weight:800;font-size:13px;padding:8px 14px;border-radius:999px;white-space:nowrap}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:4px 30px 36px}
.card{background:#fff;border-radius:24px;padding:18px;box-shadow:0 5px 0 #F0DFC0;display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.sp{flex:1}
.col{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.small{font-size:13px;font-weight:700;color:#5B5F85;line-height:1.4}
.b{font-weight:800}
.btn{min-height:44px;border-radius:999px;padding:0 18px;font-weight:800;font-size:15px;color:#fff;background:#6C3CE9;box-shadow:0 3px 0 rgba(31,35,64,.18);white-space:nowrap}
.btn:active,.pill:active,.rb:active,.nav:active{transform:translateY(2px)}
.btn.big{min-height:52px;font-size:16px;font-weight:900;padding:0 24px}
.btn.green{background:#12805C}.btn.blue{background:#1D6FE0}.btn.teal{background:#00857F}.btn.red{background:#D62839}.btn.dark{background:#2B1B6B}
.btn.orange{background:#C2410C}.btn.yellow{background:#FFC21A;color:#1F2340}.btn.white{background:#fff;color:#1F2340}
.btn.grey{background:#E6E8F5;color:#3A3F66;box-shadow:none}.btn.lgreen{background:#E3F8EC;color:#0B5A40;box-shadow:none}
.pill{min-height:44px;border-radius:999px;padding:0 18px;font-weight:800;font-size:15px;background:#fff;color:#1F2340;box-shadow:0 3px 0 #F0DFC0;white-space:nowrap}
.pill.on{color:#fff;box-shadow:0 3px 0 rgba(31,35,64,.28)}
.tag{font-weight:800;font-size:12px;padding:5px 11px;border-radius:999px;white-space:nowrap}
.tag.ok{background:#E3F8EC;color:#0B5A40}.tag.bad{background:#D62839;color:#fff}.tag.y{background:#FFC21A;color:#1F2340}.tag.g{background:#E6E8F5;color:#1F2340}
.inp{min-height:44px;border-radius:12px;border:2px solid #C9B8FF;padding:0 12px;font-size:16px;font-weight:700;background:#fff;min-width:0;width:100%}
.inp.w{border-color:#F0C36A}.inp.gr{border-color:#9FDCC0}.inp.t{border-color:#7DE0D0}
textarea.inp{padding:10px 12px;min-height:80px;resize:vertical}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:13px;font-weight:800}
.fg{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.fg3{grid-template-columns:repeat(3,minmax(0,1fr))}
.panel{border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.note{border-radius:16px;padding:12px 16px;font-size:14px;font-weight:700;line-height:1.5}
.note.g{background:#E3F8EC}.note.b{background:#EAF2FF}.note.y{background:#FFF1D6}.note.p{background:#F1EBFF}
.pm{font-weight:900;font-size:20px;color:#6C3CE9;width:24px;text-align:center}
.rb{width:44px;height:44px;border-radius:50%;font-size:24px;font-weight:900;flex:none;line-height:1}
.rb.minus{background:#fff;color:#D62839;box-shadow:0 2px 0 #EADBC0}.rb.plus{background:#12805C;color:#fff}
.line{display:flex;align-items:center;gap:10px;background:#FFF6E5;border-radius:14px;padding:6px 10px}
.line .ln{flex:1;font-weight:900;font-size:16px}
.line .qn{width:28px;text-align:center;font-weight:900;font-size:20px}
.line .ls{width:90px;text-align:right;font-weight:900;font-size:15px}
.tot{display:flex;align-items:center;gap:12px;background:#2B1B6B;color:#fff;border-radius:16px;padding:10px 14px}
.tot span{flex:1;font-size:15px;font-weight:800}.tot b{font-size:24px;font-weight:900}
.bill{background:#fff;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px}
.bt{font-size:16px;font-weight:900}
.gcard{background:#F7F3FF;border-radius:16px}.gcard.open{background:#F1EBFF}
.grow{display:flex;align-items:center;gap:10px;padding:6px 12px;flex-wrap:wrap}
.gtoggle{flex:1;min-width:220px;display:flex;align-items:center;gap:10px;min-height:48px;background:transparent;text-align:left;color:#1F2340}
.av{width:40px;height:40px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;color:#fff}
.gtxt{display:flex;flex-direction:column;flex:1;min-width:0}
.gtxt b{font-size:16px;font-weight:900}.gtxt small{font-size:13px;font-weight:700;color:#5B5F85}
.gdet{padding:0 14px 14px 62px;display:flex;flex-direction:column;gap:10px}
.hd{background:#fff;display:flex;align-items:center;gap:12px;min-height:56px;width:100%;padding:14px 18px;text-align:left;color:#1F2340;font-size:19px;font-weight:900}
.acc{background:#fff;border-radius:22px;box-shadow:0 5px 0 #F0DFC0;overflow:hidden}
.dish{display:flex;align-items:center;gap:12px;background:#FFF6E5;border-radius:16px;padding:8px 12px}
.dish .nm{flex:1;font-weight:800;font-size:15px;line-height:1.3}
.mt{font-weight:800;font-size:12px;padding:5px 10px;border-radius:999px;min-width:60px;text-align:center}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .h{text-align:center;font-size:13px;font-weight:900;color:#5B5F85}
.day{min-height:92px;border-radius:14px;padding:6px;display:flex;flex-direction:column;gap:3px;background:#FFF6E5;border:3px solid transparent;min-width:0}
.day.out{background:#F4F1EA}.day.today{border-color:#00857F}
.dn{font-size:14px;font-weight:900}.day.out .dn{color:#A9A6B8}.day.today .dn{color:#00857F}
.bar{display:block;font-size:12px;font-weight:800;color:#fff;padding:3px 6px;min-height:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;border-radius:0}
.bar.sel{box-shadow:0 0 0 3px #1F2340;position:relative}
.more{font-size:11px;font-weight:800;color:#5B5F85}
.dot{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:5px;vertical-align:-2px}
/* teal summary */
.sum{background:#00857F;color:#fff;border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 5px 0 #005E5A}
.sum .r{background:rgba(255,255,255,.18);border-radius:16px;padding:12px 14px;display:flex;justify-content:space-between;font-weight:800;font-size:16px}
.sum .r.y{background:#FFC21A;color:#1F2340;font-weight:900;font-size:20px}
.ord{background:rgba(255,255,255,.18);border-radius:16px}
.ord button{display:flex;align-items:center;gap:8px;padding:8px 12px;min-height:44px;width:100%;background:transparent;color:#fff;text-align:left}
/* phone */
.ov{position:fixed;inset:0;background:rgba(31,35,64,.72);z-index:50;display:flex;align-items:center;justify-content:center;gap:24px;padding:16px;overflow:auto}
.phone{width:390px;max-width:100%;height:min(780px,94vh);background:#fff;border:10px solid #1F2340;border-radius:40px;overflow-y:auto;position:relative;flex:none}
.ph-h{background:#00857F;color:#fff;padding:20px 18px 16px;display:flex;flex-direction:column;gap:4px}
.ph-b{padding:14px;display:flex;flex-direction:column;gap:12px;background:#FFF6E5}
.ovside{display:flex;flex-direction:column;gap:12px;max-width:260px;color:#fff}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1F2340;color:#fff;padding:14px 22px;border-radius:999px;font-weight:800;font-size:16px;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:90vw;text-align:center}
.pw{display:flex;align-items:center;gap:6px}
.inp.pi{width:92px;min-height:40px;padding:0 8px;text-align:right;font-weight:900;font-size:16px}
.inp.pi.chg{border-color:#F0A500;background:#FFF1D6}
.rs{width:36px;height:36px;font-size:18px;background:#FFF1D6;color:#1F2340}
.rx{background:#FFE3E6;color:#D62839;font-size:22px}
.inp.xn{flex:1;min-width:150px;width:auto}
.line.xl{background:#EAF2FF}
.paybtn{min-height:58px;border-radius:16px;font-weight:900;font-size:18px;color:#fff;width:100%}
.seg{display:inline-flex;border-radius:999px;overflow:hidden;box-shadow:0 0 0 2px #C9B8FF;background:#fff}
.seg button{min-height:46px;padding:0 22px;font-weight:800;font-size:15px;background:#fff;color:#5B5F85}
.seg button.y{background:#12805C;color:#fff}.seg button.n{background:#D62839;color:#fff}
.gs{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;align-items:start}
.gs.one{grid-template-columns:minmax(0,1fr)}
.fg5{grid-template-columns:repeat(5,minmax(0,1fr))}
.badge{border:none;cursor:pointer}
@media (max-width:900px){
 .app{flex-direction:column}
 .side{width:100%;flex-direction:row;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;padding:8px 10px;gap:6px;align-items:center;flex:none}
 .side>*{flex:none}
 .logo,.sidenote{display:none}
 .nav{width:auto;min-height:46px;font-size:15px;padding:4px 14px}.nav i{display:none}
 .sidebtn{width:auto;padding:0 18px;min-height:46px;margin:0!important;font-size:15px}
 .top{padding:12px 16px 6px}.top h1{font-size:24px}.scroll{padding:4px 16px 28px}
 .grid2,.fg,.fg3,.gs{grid-template-columns:minmax(0,1fr)}
 .fg5{grid-template-columns:repeat(2,minmax(0,1fr))}
 .day{min-height:70px;padding:3px}.bar{font-size:10px;padding:2px 3px}
 .gdet{padding-left:14px}
}

/* větší písmo a tlačítka (slabší zrak) */
.btn{min-height:54px;font-size:17px;padding:0 22px}
.btn.big{min-height:60px;font-size:19px}
.pill{min-height:54px;font-size:17px;padding:0 22px}
.rb{width:54px;height:54px;font-size:30px}
.nav{min-height:56px;font-size:19px}.nav i{width:36px;height:36px;font-size:18px}
.sidebtn{min-height:58px;font-size:19px}
.top h1{font-size:36px}.top small{font-size:16px}.badge{font-size:15px;padding:10px 16px}
.tag{font-size:14px;padding:6px 12px}
.inp{min-height:54px;font-size:18px}
.small{font-size:15px}
.gtxt b{font-size:19px}.gtoggle{min-height:60px}
.av{width:46px;height:46px;font-size:16px}
.line .ln{font-size:18px;min-width:120px}.line .qn{font-size:22px;width:34px}.line .ls{font-size:17px;width:100px}
.inp.pi{min-height:50px;font-size:18px;width:104px}
.tot b{font-size:28px}.tot span{font-size:17px}
.bt{font-size:19px}
.seg button{min-height:54px;font-size:17px;padding:0 24px}
.hd{font-size:21px}
.pm{font-size:26px}
.bar{font-size:13px;min-height:26px}.dn{font-size:16px}.cal .h{font-size:15px}
.day{min-height:100px}
.fld label{font-size:15px}
.note{font-size:16px}
.bill{container-type:inline-size}
.line{display:grid;grid-template-columns:minmax(0,1fr) 232px 154px 104px 48px;gap:10px;align-items:center;flex-wrap:nowrap}
.line .ln{min-width:0;display:flex;flex-direction:column;line-height:1.2}
.line .ln small{font-size:13px;font-weight:700;color:#5B5F85}
.line .pw{display:flex;align-items:center;gap:6px}
.line .pw.pc{width:232px}
.line .pw.pc .small{flex:1;white-space:nowrap;font-size:14px}
.line .ls{width:auto;text-align:right}
.inp.pi{width:96px;flex:none}
.rs{flex:none}.rs.off{visibility:hidden}
.line .xn{width:100%;min-width:0}
@container (max-width:760px){
 .line{grid-template-columns:auto auto minmax(0,1fr) auto}
 .line>.ln,.line>.xn{grid-column:1/-1}
}
.ck{width:46px;height:46px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 3px #C9B8FF;flex:none;font-size:28px;font-weight:900;color:#fff;display:flex;align-items:center;justify-content:center}
.ck.on{background:#6C3CE9;box-shadow:none}
.krow{display:flex;align-items:center;gap:10px;padding:6px 12px}
.ktg{flex:1;min-width:0;display:flex;align-items:center;gap:10px;min-height:56px;background:transparent;text-align:left;color:#1F2340;flex-wrap:wrap}
.ktg .kn{flex:1;min-width:180px;display:flex;flex-direction:column}
.ktg .kn b{font-size:19px;font-weight:900}
@media (max-width:900px){
 .side{flex-wrap:wrap;overflow:visible;justify-content:center}
 .side>*{flex:1 1 30%}
 .nav{min-height:52px;font-size:17px;padding:4px 8px;justify-content:center;text-align:center;width:auto}
 .sidebtn{min-height:52px;font-size:17px;padding:0 8px}
}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:8px;align-items:start}
.ggrid .gcard.open{grid-column:1/-1}
.ggrid .gtoggle{min-width:0;min-height:52px;gap:6px}
.ggrid .gcard:not(.open) .av{display:none}
.ggrid .gcard:not(.open){border-left:8px solid #C9B8FF}
.ggrid .gtxt b{font-size:17px;white-space:normal;line-height:1.2}
.ggrid .gtoggle .tag{font-size:12px;padding:4px 8px}
.ggrid .grow{padding-left:4px}
</style>

<script>
(function(){
'use strict';
var TODAY=toIso(new Date()),TY=new Date().getFullYear(),TM=new Date().getMonth();

/* ---------- pomocné funkce ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function kc(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,' ')+' Kč';}
var DN=['Neděle','Pondělí','Úterý','Středa','Čtvrtek','Pátek','Sobota'];
var MN=['leden','únor','březen','duben','květen','červen','červenec','srpen','září','říjen','listopad','prosinec'];
function parse(i){var p=i.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function toIso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function addDays(i,n){var d=parse(i);d.setDate(d.getDate()+n);return toIso(d);}
function dm(i){var d=parse(i);return d.getDate()+'. '+(d.getMonth()+1)+'.';}
function dmy(i){return dm(i)+' '+parse(i).getFullYear();}
function diffDays(a,b){return Math.round((parse(b)-parse(a))/864e5);}
function dayLabel(i){return DN[parse(i).getDay()]+' '+dm(i);}
function rangeTxt(a,b){var x=parse(a),y=parse(b);if(a===b)return dm(a);return x.getMonth()===y.getMonth()?x.getDate()+'.–'+y.getDate()+'. '+(x.getMonth()+1)+'.':dm(a)+' – '+dm(b);}
function initials(n){return n.split(/\s+/).filter(Boolean).slice(0,2).map(function(w){return w[0].toUpperCase();}).join('');}
function pl(n,a,b,c){return n===1?a:(n>=2&&n<=4?b:c);}
function persTxt(n){return n+' '+pl(n,'osoba','osoby','osob');}

var PL={ub:['Ubytování','noc'],di:['Dítě 3–12 let','dítě a noc'],st:['Dítě / student 12–18 let','osoba a noc'],sn:['Snídaně','ks'],ob:['Oběd','ks'],ve:['Večeře','ks'],ka:['Káva','ks'],pp:['Místní poplatek z pobytu','os. a noc'],pes:['Pes','pes a noc']};
var METHODS={hotove:['Hotově','#12805C','#E3F8EC'],qr:['QR kód','#1D6FE0','#EAF2FF'],prevod:['Převodem','#6C3CE9','#F1EBFF'],predem:['Zaplaceno předem','#C2410C','#FFE9D6']};

var HIST0=[];

/* ---------- výchozí (prázdná) data; skutečná data se načítají z úložiště ---------- */
var S;
var DEFP={ub1:530,ub2:530,di:0,st:530,sn:120,ob:150,ve:100,ka:20,pp:15,pes:100};
function seed(){
 return {guests:[],stays:[],payments:[],groupDefs:[],
  priceLists:[{id:'pl1',name:'Běžný ceník',from:'',to:'',groups:['indiv'],p:Object.assign({},DEFP)}],
  manual:[],rebook:{},police:{},mailed:{},bank:{acc:'',name:''},biz:{name:'',addr:'',ico:'',dic:'',vat:false,phone:''},seq:100};
}
function nightsOfStay(stays,x){var s=stays.filter(function(t){return t.guestId===x.id;})[0];return s?Math.max(1,diffDays(s.from,s.to)):1;}
function grpNights(k){var s=curStay(k);return s?Math.max(1,diffDays(s.from,s.to)):1;}
function defBill(x,M,nights){
 M={sn:0,ob:0,ve:0,ka:0};
 return x.only?{ub:0,sn:0,ob:M.ob,ve:M.ve,ka:M.ka,pp:0}:{ub:nights,sn:M.sn,ob:M.ob,ve:M.ve,ka:M.ka,pp:x.persons*nights};
}
function fresh(){
 var d=seed();
 Object.assign(d,{screen:'kal',scrollTop:true,calOff:0,calSel:null,calNewOpen:false,calKind:null,calGrp:null,calMsg:'',calOk:false,
  grp:'',stayPick:{},open:{},form:{},newGroupOpen:false,newGuestOpen:false,payM:{},resetArm:false,
  payGroup:'',payGuest:'',pay:'qr',payFilter:'all',bookFilter:'all',bookFormOpen:false,bookPeriod:'all',kFrom:'',kTo:'',bookSel:{},eetFilter:'all',focusId:null,pickFor:null,indivFocus:null,calView:'cal',resF:'up',grpF:'all',payGF:'all',query:''});
 var keep=S;S=d;d.payments.forEach(function(p){var g=G(p.gid);if(g)p.sum=total(g);});S=keep;
 return d;
}

/* ---------- vyhledávače ---------- */
function G(id){return S.guests.filter(function(x){return x.id===id;})[0];}
function grpDef(k){return S.groupDefs.filter(function(d){return d.key===k;})[0];}
function grpName(k){var d=grpDef(k);return k==='indiv'?'Individuálové':(d?d.name:k);}
function grpColor(k){var d=grpDef(k);return k==='indiv'?'#C2410C':(d?d.color:'#6C3CE9');}
function staysOf(k){return S.stays.filter(function(s){return s.grp===k;}).sort(function(a,b){return a.from<b.from?-1:1;});}
function curStay(k){
 var l=staysOf(k);if(!l.length)return null;
 var p=S.stayPick[k];var f=l.filter(function(s){return s.id===p;})[0];if(f)return f;
 var up=l.filter(function(s){return s.to>=TODAY;});return up.length?up[0]:l[l.length-1];
}
function stayOfGuest(g){return S.stays.filter(function(s){return s.guestId===g.id;})[0];}
function stayName(s){return s.grp==='indiv'?G(s.guestId).name:grpName(s.grp);}
function stayColor(s){return s.to<TODAY?'#B8B5C8':grpColor(s.grp);}
function stayPersons(s){
 if(s.grp==='indiv')return G(s.guestId).persons;
 return S.guests.filter(function(x){return x.grp===s.grp&&x.here;}).reduce(function(a,x){return a+x.persons;},0);
}
function stayOf(g){return g.grp==='indiv'?stayOfGuest(g):curStay(g.grp);}
function guestDates(g){var s=stayOf(g);if(!s)return {from:TODAY,to:TODAY};if(g.grp==='indiv')return s;return {from:g.arr||s.from,to:g.dep||s.to};}
function inBookNow(g){if(g.inBook)return true;var s=stayOf(g);return !!(g.here&&!g.only&&s&&guestDates(g).from<=TODAY);}
function nightsOf(g){var d=guestDates(g);return Math.max(1,diffDays(d.from,d.to));}
function listFor(g){
 var d=guestDates(g).from;
 var c=S.priceLists.filter(function(l){return l.groups.indexOf(g.grp)>=0;});
 var dated=c.filter(function(l){return l.from&&l.to&&l.from<=d&&d<=l.to;}).sort(function(a,b){return diffDays(a.from,a.to)-diffDays(b.from,b.to);});
 if(dated.length)return dated[0];
 var und=c.filter(function(l){return !l.from||!l.to;});
 if(und.length)return und[0];
 return c[0]||S.priceLists[0];

  var locJ=idx>=0?cj(arr[idx]):null,unsaved=LOADED&&idx>=0&&LAST[p]!==undefined&&locJ!==LAST[p];
  if(ch.type==='removed'){delete LAST[p];if(idx>=0&&!unsaved){arr.splice(idx,1);changed=true;}return;}
  var d=ch.doc.data();if(!d)return;var j=cj(d);
